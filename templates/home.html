<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{.BlogTitle}}</title>
  <meta name="description" content="{{.BlogTitle}}">

  <style>
    :root {
      --paper: #fff;
      --ink: #383633;
      --ink-soft: #77736d;
      --ink-faint: #aaa69f;
      --line: #e4e1db;

      --content-width: 720px;
      --side-padding: 24px;

      --serif:
        Georgia,
        "Times New Roman",
        Times,
        serif;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #171614;
    }

    ::selection {
      background: #dedbd4;
      color: #22201d;
    }

    .page {
      width: min(
        calc(100% - (var(--side-padding) * 2)),
        var(--content-width)
      );

      margin: 0 auto;
      padding: 64px 0 40px;
    }

    .site-header {
      margin-bottom: 30px;
    }

    .site-title {
      display: inline-block;
      margin: 0;

      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .posts-heading {
      margin: 0 0 10px;

      font-family: var(--sans);
      font-size: 18px;
      font-weight: 600;
    }

    .post-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .post {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;

      padding: 11px 0;
    }

    .post:first-child {
      padding-top: 0;
    }

    .post-link {
      font-size: 14px;
      line-height: 1.45;
    }

    .post-link span {
      border-bottom: 1px solid transparent;
    }

    .post-link:hover span {
      border-color: var(--ink);
    }

    .post-date {
      padding-top: 3px;

      color: var(--ink-faint);

      font-family: var(--sans);
      font-size: 12px;
      line-height: 1.5;

      white-space: nowrap;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;

      margin-top: 82px;
      padding-top: 18px;

      border-top: 1px solid var(--line);

      color: var(--ink-faint);

      font-family: var(--sans);
      font-size: 12px;
    }

    .site-footer a:hover {
      color: var(--ink);
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="site-header">
      <a href="/" class="site-title"> {{.BlogTitle}} </a>
    </header>

    <section>
      <h2 class="posts-heading"> Posts </h2>
      {{if .Posts}}
        <ul class="post-list">
          {{range .Posts}}
            <li class="post">
              <a class="post-link" href="/{{.Route}}"> <span>{{.Title}}</span> </a>
              <time class="post-date" datetime="{{.FormattedDate}}"> {{.FormattedDate}} </time>
            </li>
          {{end}}
        </ul>
      {{end}}
    </section>


    <footer class="site-footer">
      <a href="/">Home</a>
      <a href="/rss.xml">RSS</a>
    </footer>

  </main>

</body>
</html>
