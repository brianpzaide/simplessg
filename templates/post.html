<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{.BlogTitle}}</title>
  <meta name="description" content="{{.BlogTitle}}">

  <style>
    :root {
      --paper: #fff;
      --ink: #383633;
      --ink-soft: #77736d;
      --ink-faint: #aaa69f;
      --line: #e4e1db;

      --content-width: 720px;
      --side-padding: 24px;

      --serif:
        Georgia,
        "Times New Roman",
        Times,
        serif;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      line-height: 1.65;
    }

    a {
      color: inherit;
    }

    a:hover {
      color: #171614;
    }

    ::selection {
      background: #dedbd4;
      color: #22201d;
    }

    .page {
      width: min(
        calc(100% - (var(--side-padding) * 2)),
        var(--content-width)
      );

      margin: 0 auto;
      padding: 64px 0 40px;
    }

    .site-header {
      margin-bottom: 64px;
    }

    .site-title {
      display: inline-block;
      color: var(--ink);
      text-decoration: none;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .post-header {
      margin-bottom: 44px;
    }

    .post-title {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .post-date {
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: 12px;
    }

    .post-content {
      font-size: 17px;
      line-height: 1.7;
    }

    .post-content p {
      margin: 0 0 1.5em;
    }

    .post-content h2,
    .post-content h3 {
      line-height: 1.3;
    }

    .post-content h2 {
      margin: 2em 0 0.7em;
      font-size: 26px;
    }

    .post-content h3 {
      margin: 1.7em 0 0.6em;
      font-size: 21px;
    }

    .post-content a {
      text-decoration: underline;
      text-decoration-color: var(--ink-faint);
      text-underline-offset: 3px;
    }

    .post-content ul,
    .post-content ol {
      margin: 0 0 1.5em;
      padding-left: 1.5em;
    }

    .post-content li {
      margin: 0.3em 0;
    }

    .post-content blockquote {
      margin: 1.5em 0;
      padding-left: 18px;
      border-left: 2px solid var(--line);
      color: var(--ink-soft);
      font-style: italic;
    }

    .post-content img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 2em auto;
    }

    .post-content table {
      width: 100%;
      margin: 2em 0;
      border-collapse: collapse;
      font-family: var(--sans);
      font-size: 14px;
    }

    .post-content th,
    .post-content td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .post-content th {
      border-top: 1px solid var(--line);
      font-weight: 600;
    }

    .post-content td {
      color: var(--ink-soft);
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: 12px;
    }

    .site-footer a {
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="page">
    <article>
      <header class="post-header">
        <h1 class="post-title"> {{.Title}}</h1>
        <time class="post-date" datetime="{{.FormattedDate}}"> {{.FormattedDate}} </time>
      </header>

      <div class="post-content"> {{.Content}} </div>
    </article>


    <footer class="site-footer">
      <a href="/">Home</a>
      <a href="/rss.xml">RSS</a>
    </footer>
  </main>

</body>
</html>
